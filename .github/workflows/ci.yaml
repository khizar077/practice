name: Sequential Hello World

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job 1: Runs first
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello World from the FIRST job!"

  # Job 2: Waits for Job 1 to finish successfully
  second-job:
    runs-on: ubuntu-latest
    needs: first-job # <-- This forces the sequence
    steps:
      - name: Say Goodbye
        run: echo "Goodbye World from the SECOND job!"

